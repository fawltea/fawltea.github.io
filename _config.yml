# Site settings
name: Jake Stocker
author: Jake Stocker
description: DevOps engineer from Cardiff
email: hello@jakestocker.com
github: fawltea
avatar: /images/jake.png

url: https://jakestocker.com
baseurl:

# Links shown on the home page and in the header of every other page
nav:
  - title: About
    url: /about/
  - title: Blog
    url: /blog/
  - title: Photos
    url: /photos/
  - title: Projects
    url: /projects/

# Google Analytics (GA4) tracking ID, e.g. G-ABC1DEFG. Leave empty to disable.
google_analytics_ga4:

permalink: /blog/:title/

paginate: 10
paginate_path: /blog/page:num/

kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

include: ['_pages']

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CNAME
  - vendor
