<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body>
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.name }}</a>
      <nav class="site-nav">
        {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </header>

    <main class="site-main{% if page.wide %} wide{% endif %}">
      {{ content }}
    </main>

    <footer class="site-footer">
      <a href="mailto:{{ site.email }}">Email</a>
      <a href="https://github.com/{{ site.github }}">GitHub</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </footer>
  </body>
</html>
