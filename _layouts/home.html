<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body class="home">
    <div class="board">
      <canvas class="ripple" aria-hidden="true"></canvas>
      <div class="trace h" style="top: 13%"></div>
      <div class="trace h" style="top: 22%"></div>
      <div class="trace h" style="top: 84%"></div>
      <div class="trace v" style="left: 8%"></div>
      <div class="trace v wide-only" style="left: 23%"></div>
      <div class="trace v" style="left: 79%"></div>
      <div class="trace v wide-only" style="left: 91%"></div>

      <main class="home-main">
        <div class="frame">
          <span class="edge top"></span>
          <span class="edge bottom"></span>
          <span class="edge left"></span>
          <span class="edge right"></span>
          <h1 class="home-name">{{ site.name }}</h1>
        </div>
        {% assign half = site.nav.size | divided_by: 2 %}
        <nav class="home-nav">
          <span class="half left">
            {% for item in site.nav limit: half %}
            <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
            {% endfor %}
          </span>
          <span class="half right">
            {% for item in site.nav offset: half %}
            <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
            {% endfor %}
          </span>
        </nav>
        <a class="home-aside" href="{{ '/ai/' | relative_url }}">AI statement</a>
      </main>
    </div>
    <script src="{{ '/assets/ripple.js' | relative_url }}" defer></script>
  </body>
</html>
