---
layout: default
---

<article class="post">
  <p class="post-date"><a href="{{ '/blog/' | relative_url }}">Blog</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
  <h1 class="page-title">{{ page.title }}</h1>
  <div class="entry">
    {{ content }}
  </div>
</article>
