- name: Stocker
  description: An intraday stock trader. Each morning it picks a few S&P 500 stocks from news sentiment, trades short price curves through the day, and is out of the market by the close. Tested on backtests and paper trading first.

- name: Tobin
  description: Pull-based continuous delivery for Docker containers, like Argo CD but for plain Docker hosts. An agent on each host keeps its Compose apps matching a deploy manifest in git and rolls back when a deploy goes unhealthy.

- name: Training
  url: /training/
  description: A log of my triathlon training. I paste the stats from each session into a chat with Claude, which turns them into an update to this site and opens a pull request.
