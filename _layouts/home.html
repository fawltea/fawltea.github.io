<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}

    <main class="home-main">
      <h1 class="home-name">{{ site.name }}</h1>
      <nav class="home-nav">

        {% endfor %}
      </nav>
    </main>
  </body>
</html>
